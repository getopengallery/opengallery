# Runs the tests on every supported PHP version and checks the code style.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, zip, exif, fileinfo, mbstring, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Run the tests
        run: php artisan test

  database-backup:
    name: Database backup (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            driver: mysql
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 11.4
            image: mariadb:11.4
            driver: mariadb
            health: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: backup_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: backup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, intl, zip, exif, fileinfo, mbstring, pdo_sqlite, pdo_mysql, sodium
          coverage: none
          tools: composer:v2

      - name: Prepare the app
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Back up and restore on a real server
        env:
          BACKUP_TEST_DRIVER: ${{ matrix.database.driver }}
          BACKUP_TEST_HOST: 127.0.0.1
          BACKUP_TEST_PORT: '3306'
          BACKUP_TEST_DATABASE: backup_test
          BACKUP_TEST_USERNAME: root
          BACKUP_TEST_PASSWORD: root
        run: php artisan test tests/Feature/System/DatabaseBackupTest.php

  style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, intl, zip, exif, fileinfo, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Check the code style
        run: vendor/bin/pint --test
