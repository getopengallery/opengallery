name: Feature request
description: Suggest an improvement for OpenGallery.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs it and what they are trying to do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: hosting
    attributes:
      label: Hosting
      options:
        - label: This can work on plain shared PHP hosting, without Docker, Redis, Node.js or a queue worker.
